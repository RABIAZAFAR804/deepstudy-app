<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D5CFF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0F0F12" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="url(#grad)" opacity="0.15" />
  <g transform="translate(106, 120)" filter="url(#glow)">
    <!-- Graduation Cap / Scholar Book Core -->
    <path d="M150 20 L280 80 L150 140 L20 80 Z" fill="url(#grad)" />
    <path d="M60 110 L60 180 C60 220 240 220 240 180 L240 110" fill="none" stroke="#e1e3e4" stroke-width="12" stroke-linecap="round" />
    <path d="M280 80 L280 180" stroke="#d6baff" stroke-width="8" stroke-linecap="round" />
    <circle cx="280" cy="190" r="10" fill="#d6baff" />
    <!-- Quantum / Tech Orbit Lines -->
    <ellipse cx="150" cy="180" rx="130" ry="40" fill="none" stroke="#9D5CFF" stroke-width="6" opacity="0.8" transform="rotate(-20 150 180)" />
    <ellipse cx="150" cy="180" rx="130" ry="40" fill="none" stroke="#38BDF8" stroke-width="6" opacity="0.8" transform="rotate(20 150 180)" />
    <circle cx="150" cy="180" r="16" fill="#ecdcff" />
  </g>
</svg>
